<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Smart Rental Manager</title>


    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">


</head>


<body>


<div class="form-container">


    <!-- Logo -->

    <div class="logo">

        <i class="fa-solid fa-lock"></i>

    </div>



    <!-- Heading -->

    <h2 data-key="resetPassword">

        Reset Password

    </h2>



    <p class="subtitle" data-key="resetSubtitle">

        Create your new password.

    </p>





    <!-- Reset Password Form -->

    <form id="resetPasswordForm">



        <!-- New Password -->


        <div class="input-group">


            <label data-key="newPassword">

                New Password

            </label>



            <div class="input-box">


                <i class="fa-solid fa-lock"></i>



                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required>



                <i class="fa-solid fa-eye toggle-password"
                    id="toggleNewPassword">
                </i>


            </div>


        </div>







        <!-- Confirm Password -->


        <div class="input-group">


            <label data-key="confirmPassword">

                Confirm Password

            </label>



            <div class="input-box">


                <i class="fa-solid fa-lock"></i>



                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required>


            </div>


        </div>






        <!-- Button -->


        <button
            type="submit"
            class="submit-btn"
            onclick="window.location.href='login.html'; return false;"
            data-key="updatePassword">


            Update Password


        </button>



    </form>







    <!-- Bottom Link -->


    <div class="bottom-links">


        <p>


            <span data-key="rememberPassword">
                Remember your password?
            </span>


            <a href="login.html" data-key="login">

                Login

            </a>


        </p>


    </div>




</div>

<!-- Language Scripts -->

<script src="../js/translations.js"></script>
<script src="../js/language.js"></script>

<script src="../js/reset-password.js"></script>


</body>

</html>
