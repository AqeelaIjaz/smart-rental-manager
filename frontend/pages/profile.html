<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Profile | Smart Rental Manager</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/profile.css">


</head>


<body>



<div class="profile-container">



<!-- Header -->


<header class="page-header">


<a href="dashboard.html">

<i class="fa-solid fa-arrow-left"></i>

</a>


<h2 data-key="myProfile">

My Profile

</h2>


</header>









<!-- Profile Card -->


<div class="profile-card">


<div class="profile-image">


<i class="fa-solid fa-user"></i>


</div>



<h2 id="userName">

Ali Ahmed

</h2>



<p id="userRole" data-key="tenant">

Tenant

</p>



</div>









<!-- Personal Information (view mode) -->


<div class="info-card" id="viewInfoCard">


<h3>

<i class="fa-solid fa-user-pen"></i>

<span data-key="personalInformation">

Personal Information

</span>

</h3>






<div class="info-row">


<span data-key="fullName">

Full Name

</span>


<b id="fullName">

Ali Ahmed

</b>


</div>






<div class="info-row">


<span data-key="email">

Email

</span>


<b id="email">

ali@gmail.com

</b>


</div>






<div class="info-row">


<span data-key="phone">

Phone

</span>


<b id="phone">

0300-0000000

</b>


</div>




</div>


<!-- Personal Information (edit mode) - hidden by default -->

<div class="info-card" id="editInfoCard" style="display:none;">

<h3>
<i class="fa-solid fa-user-pen"></i>
<span>Edit Personal Information</span>
</h3>

<form id="editProfileForm">

    <div class="info-row" style="flex-direction:column; align-items:stretch; gap:6px;">
        <label for="editName">Full Name</label>
        <input type="text" id="editName" required style="padding:8px; border-radius:8px; border:1px solid #ccc;">
    </div>

    <div class="info-row" style="flex-direction:column; align-items:stretch; gap:6px;">
        <label for="editEmail">Email</label>
        <input type="email" id="editEmail" required style="padding:8px; border-radius:8px; border:1px solid #ccc;">
    </div>

    <div class="info-row" style="flex-direction:column; align-items:stretch; gap:6px;">
        <label for="editPhone">Phone</label>
        <input type="text" id="editPhone" style="padding:8px; border-radius:8px; border:1px solid #ccc;">
    </div>

    <div style="display:flex; gap:10px; margin-top:14px;">
        <button type="submit" id="saveProfileBtn" style="flex:1; padding:10px; border-radius:8px; border:none; background:#2d6a4f; color:#fff; cursor:pointer;">Save</button>
        <button type="button" id="cancelEditBtn" style="flex:1; padding:10px; border-radius:8px; border:1px solid #ccc; background:#fff; cursor:pointer;">Cancel</button>
    </div>

</form>

</div>









<!-- Account Actions -->


<div class="action-card">


<button id="editProfile">


<i class="fa-solid fa-pen"></i>


<span data-key="editProfile">

Edit Profile

</span>


</button>





<button id="logoutBtn" class="logout">


<i class="fa-solid fa-right-from-bracket"></i>


<span data-key="logout">

Logout

</span>


</button>



</div>







</div>






<script src="../js/translations.js"></script>
<script src="../js/language.js"></script>

<script src="../js/profile.js"></script>


</body>

</html>
