<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agreement Upload | Smart Rental Manager</title>


    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">


    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/agreement.css">


</head>


<body>



<div class="agreement-container">



    <!-- Header -->


    <header class="page-header">


        <a href="dashboard.html">

            <i class="fa-solid fa-arrow-left"></i>

        </a>



        <h2 data-key="uploadAgreement">

            Upload Agreement

        </h2>


    </header>









    <!-- Information Card -->



    <div class="info-card">



        <i class="fa-solid fa-file-contract"></i>



        <div>



            <h3 data-key="rentalAgreement">

                Rental Agreement

            </h3>



            <p data-key="agreementDescription">

                Upload your Urdu or English rental agreement.
                Enter the rent details manually.

            </p>



        </div>


    </div>











    <!-- Upload Area -->



    <div class="upload-box" id="uploadBox">



        <i class="fa-solid fa-cloud-arrow-up"></i>



        <h3 data-key="uploadAgreementFile">

            Upload Agreement File

        </h3>



        <p data-key="supportedFiles">

            PDF, JPG or PNG supported

        </p>




        <input 
        type="file"
        id="agreementFile"
        accept=".pdf,.jpg,.jpeg,.png">





        <button class="upload-btn" data-key="chooseFile">

            Choose File

        </button>



    </div>









    <!-- File Preview -->



    <div class="file-preview" id="filePreview">



        <i class="fa-solid fa-file"></i>



        <p data-key="noFile">

            No file selected

        </p>



    </div>











    <!-- Extracted Details Card -->



    <div class="ai-card">



        <h3>


            <i class="fa-solid fa-file-lines"></i>



            <span data-key="aiExtracted">

            Extracted Details

            </span>


        </h3>







        <div class="detail">



            <span data-key="monthlyRent">

                Monthly Rent

            </span>



            <b data-key="notDetected">

                Not detected

            </b>



        </div>







        <div class="detail">



            <span data-key="dueDate">

                Due Date

            </span>



            <b data-key="notDetected">

                Not detected

            </b>



        </div>








        <div class="detail">



            <span data-key="penaltyClause">

                Penalty Clause

            </span>



            <b data-key="notDetected">

                Not detected

            </b>



        </div>





    </div>









    <button class="submit-btn" id="submitAgreement" data-key="uploadAgreement">


        Upload Agreement


    </button>








</div>






<script src="../js/translations.js"></script>

<script src="../js/language.js"></script>

<script src="../js/agreement.js"></script>




</body>

</html>
