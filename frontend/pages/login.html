<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login | Smart Rental Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">

</head>

<body>

<div class="form-container">

    <!-- Logo -->
    <div class="logo">
        <i class="fa-solid fa-house"></i>
    </div>

    <!-- Heading -->
    <h2 data-key="userLogin">
        User Login
    </h2>

    <p class="subtitle" data-key="loginSubtitle">
        Login to your Smart Rental Manager account.
    </p>

    <!-- Login Form -->
    <form id="loginForm">

        <!-- Email -->
        <div class="input-group">

            <label data-key="email">
                Email Address
            </label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

        </div>

        <!-- Password -->
        <div class="input-group">

            <label data-key="password">
                Password
            </label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

                <i
                    class="fa-solid fa-eye toggle-password"
                    id="togglePassword">
                </i>

            </div>

        </div>

        <!-- Forgot Password -->
        <div class="forgot-link">

            <a href="forgot-password.html" data-key="forgotPassword">

                Forgot Password?

            </a>

        </div>

        <!-- Login Button -->
        <button type="submit" class="submit-btn" data-key="login">

            Login

        </button>

    </form>

    <!-- Bottom Links -->
    <div class="bottom-links">

        <p>

            <span data-key="noAccount">
                Don't have an account?
            </span>

            <a href="signup.html" data-key="signup">

                Sign Up

            </a>

        </p>

        <p style="margin-top:12px;">

            <span data-key="adminQuestion">
                Are you an Admin?
            </span>

            <a href="admin-login.html" data-key="adminLogin">

                Admin Login

            </a>

        </p>

    </div>

</div>

<!-- Language Scripts -->
<script src="../js/translations.js"></script>
<script src="../js/language.js"></script>

<!-- Login Script -->
<script src="../js/user-login.js"></script>

</body>

</html>
