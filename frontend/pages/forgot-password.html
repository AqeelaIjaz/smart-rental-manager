<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Smart Rental Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">

</head>

<body>

<div class="form-container">

    <!-- Logo -->
    <div class="logo">
        <i class="fa-solid fa-key"></i>
    </div>

    <!-- Title -->
    <h2 data-key="forgotPassword">
        Forgot Password
    </h2>

    <p class="subtitle" data-key="forgotSubtitle">
        Enter your registered email address to receive an OTP.
    </p>

    <!-- Forgot Password Form -->
    <form>

        <!-- Email -->
        <div class="input-group">

            <label data-key="email">
                Email Address
            </label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>

        </div>

        <!-- Send OTP Button -->
        <button
            type="button"
            class="submit-btn"
            onclick="window.location.href='otp.html'"
            data-key="sendOtp">

            Send OTP

        </button>

    </form>

    <!-- Back Login -->
    <div class="bottom-links">

        <p>

            <span data-key="rememberPassword">
                Remember your password?
            </span>

            <a href="login.html" data-key="login">
                Login
            </a>

        </p>

    </div>

</div>

<!-- Language Scripts -->
<script src="../js/translations.js"></script>
<script src="../js/language.js"></script>

</body>

</html>
