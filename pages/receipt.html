<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receipt | Smart Rental Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/receipt.css">

<!-- Used by receipt.js to let the user download the receipt as an image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

<div class="receipt-container">

<!-- Header -->
<header class="page-header">
<a href="dashboard.html">
<i class="fa-solid fa-arrow-left"></i>
</a>
<h2>
Payment Receipt
</h2>
</header>

<!-- Receipt Card -->
<div class="receipt-card">
<div class="success-icon">
<i class="fa-solid fa-circle-check"></i>
</div>
<h2>
Payment Successful
</h2>
<p>
Your rent payment has been recorded.
</p>
</div>

<!-- QR Code -->
<div class="qr-card">
<h3>
Digital QR Receipt
</h3>

<div class="qr-box" id="qrBox">
<i class="fa-solid fa-qrcode"></i>
</div>

<p>
Scan this QR code to verify payment.
</p>
</div>

<!-- Payment Details -->
<div class="details-card">
<h3>
Payment Details
</h3>

<div class="detail-row">
<span>
Tenant Name
</span>
<b id="tenantName">
User
</b>
</div>

<div class="detail-row">
<span>
Amount
</span>
<b id="amountValue">
Rs. 0
</b>
</div>

<div class="detail-row">
<span>
Date
</span>
<b id="paymentDate">
Today
</b>
</div>

<div class="detail-row">
<span>
Status
</span>
<b id="statusValue" class="paid">
Paid
</b>
</div>

</div>

<button id="downloadReceipt" class="submit-btn">
Download Receipt
</button>

</div>

<script src="../js/receipt.js"></script>

</body>

</html>
