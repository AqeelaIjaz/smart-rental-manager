<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Smart Rental Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">

</head>

<body>

<div class="form-container">

    <!-- Logo -->
    <div class="logo">
        <i class="fa-solid fa-user-plus"></i>
    </div>

    <!-- Heading -->
    <h2 data-key="createAccount">
        Create Account
    </h2>

    <p class="subtitle" data-key="signupSubtitle">
        Create your Smart Rental Manager account.
    </p>

    <!-- Signup Form -->
    <form id="signupForm">

        <!-- Full Name -->
        <div class="input-group">

            <label data-key="fullName">
                Full Name
            </label>

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>

            </div>

        </div>

        <!-- Email -->
        <div class="input-group">

            <label data-key="email">
                Email Address
            </label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

        </div>

        <!-- Phone -->
        <div class="input-group">

            <label data-key="phone">
                Phone Number
            </label>

            <div class="input-box">

                <i class="fa-solid fa-phone"></i>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required>

            </div>

        </div>

        <!-- Password -->
        <div class="input-group">

            <label data-key="password">
                Password
            </label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required>

                <i class="fa-solid fa-eye toggle-password"
                    id="togglePassword"></i>

            </div>

        </div>

        <!-- Confirm Password -->
        <div class="input-group">

            <label data-key="confirmPassword">
                Confirm Password
            </label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required>

            </div>

        </div>

        <!-- Sign Up -->
        <button type="submit" class="submit-btn" data-key="createAccount">

            Create Account

        </button>

    </form>

    <!-- Bottom Links -->
    <div class="bottom-links">

        <p>

            <span data-key="alreadyAccount">
                Already have an account?
            </span>

            <a href="login.html" data-key="login">

                Login

            </a>

        </p>

    </div>

</div>

<!-- Language Scripts -->
<script src="../js/translations.js"></script>
<script src="../js/language.js"></script>

<!-- Signup Script -->
<script src="../js/signup.js"></script>

</body>

</html>
