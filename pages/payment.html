<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Payment | Smart Rental Manager</title>


<!-- Google Font -->

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<!-- CSS -->

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/payment.css">


</head>


<body>


<div class="payment-container">



<!-- Header -->

<header class="page-header">


<a href="dashboard.html">

<i class="fa-solid fa-arrow-left"></i>

</a>


<h2 data-key="rentPayment">
Rent Payment
</h2>


</header>







<!-- Payment Information -->


<div class="payment-card">


<i class="fa-solid fa-house"></i>


<div>


<h3 data-key="monthlyRent">
Monthly Rent
</h3>


<p data-key="upcomingRent">
Your upcoming rent payment
</p>


</div>



</div>









<!-- Amount -->


<div class="input-card">


<h3 data-key="enterAmount">
Enter Amount
</h3>


<div class="amount-box">


<span>
Rs.
</span>


<input 
type="number"
id="paymentAmount"
placeholder="35000">


</div>


</div>









<!-- Payment Method -->


<div class="input-card">


<h3 data-key="paymentMethod">
Payment Method
</h3>



<div class="methods">



<label>

<input type="radio" name="method">

<span data-key="bankTransfer">
Bank Transfer
</span>

</label>






<label>

<input type="radio" name="method">

<span data-key="cash">
Cash
</span>

</label>






<label>

<input type="radio" name="method">

<span data-key="onlinePayment">
Online Payment
</span>

</label>





</div>


</div>









<!-- Payment Status -->


<div class="status-card">


<i class="fa-solid fa-circle-info"></i>


<p id="paymentStatus" data-key="paymentConfirmation">

Payment confirmation will appear here.

</p>


</div>








<button id="payBtn" class="submit-btn" data-key="confirmPayment">

Confirm Payment

</button>







</div>








<!-- Scripts -->

<script src="../js/translations.js"></script>

<script src="../js/language.js"></script>

<script src="../js/payment.js"></script>



</body>

</html>
