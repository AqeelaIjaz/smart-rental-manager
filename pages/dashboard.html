<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Smart Rental Manager</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">


</head>


<body>


<div class="dashboard-container">



<header class="dashboard-header">


<div class="user-info">


<div class="profile-icon">

<i class="fa-solid fa-user"></i>

</div>


<div>

<h3 data-key="welcomeUser">
Welcome, User
</h3>


<p data-key="tenantAccount">
Tenant Account
</p>


</div>


</div>



<button class="notification-btn"
onclick="window.location.href='notifications.html'">

<i class="fa-solid fa-bell"></i>

</button>


</header>





<section class="rent-card">


<div>


<h3 data-key="rentReminder">
Rent Reminder
</h3>


<p data-key="rentDue">
Your rent is due in 5 days
</p>


</div>


<i class="fa-solid fa-calendar-days"></i>


</section>






<h2 class="section-title" data-key="quickActions">

Quick Actions

</h2>




<div class="action-grid">



<a href="agreement-upload.html" class="action-card">

<i class="fa-solid fa-file-contract"></i>

<p data-key="agreement">
Agreement
</p>

</a>





<a href="complaint.html" class="action-card">

<i class="fa-solid fa-microphone"></i>

<p data-key="complaint">
Complaint
</p>

</a>





<a href="repair.html" class="action-card">

<i class="fa-solid fa-screwdriver-wrench"></i>

<p data-key="repair">
Repair
</p>

</a>





<a href="payment.html" class="action-card">

<i class="fa-solid fa-money-bill"></i>

<p data-key="payment">
Payment
</p>

</a>



</div>







<section class="risk-card">


<div>


<h3 data-key="riskScore">

Rental Risk Score

</h3>


<p data-key="lowRisk">

Low Risk

</p>


</div>


<div class="risk-circle">

20%

</div>


</section>








<h2 class="section-title" data-key="recentNotifications">

Recent Notifications

</h2>





<div class="notification-card">


<i class="fa-solid fa-circle-check"></i>


<p data-key="paymentGenerated">

Payment receipt generated successfully.

</p>


</div>








<nav class="bottom-nav">


<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

<span data-key="home">
Home
</span>

</a>



<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span data-key="profile">
Profile
</span>

</a>




<a href="settings.html">

<i class="fa-solid fa-gear"></i>

<span data-key="settings">
Settings
</span>

</a>



</nav>



</div>




<script src="../js/translations.js"></script>
<script src="../js/language.js"></script>

<script src="../js/dashboard.js"></script>


</body>

</html>
