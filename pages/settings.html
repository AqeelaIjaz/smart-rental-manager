<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | Smart Rental Manager</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/settings.css">


</head>


<body>



<div class="settings-container">



<header class="page-header">


<a href="dashboard.html">

<i class="fa-solid fa-arrow-left"></i>

</a>


<h2 data-key="settings">
Settings
</h2>


</header>





<div class="setting-card">


<h3>

<i class="fa-solid fa-language"></i>

<span data-key="language">
Language
</span>

</h3>




<div class="option-row">


<span data-key="english">
English
</span>


<input 
type="radio"
name="language"
id="english"
checked>


</div>





<div class="option-row">


<span>
اردو
</span>


<input 
type="radio"
name="language"
id="urdu">


</div>



</div>







<div class="setting-card">


<h3>

<i class="fa-solid fa-arrows-left-right"></i>

<span data-key="layoutDirection">
Layout Direction
</span>


</h3>




<div class="toggle-row">


<span data-key="rtl">
Right To Left (RTL)
</span>



<label class="switch">


<input 
type="checkbox"
id="rtlToggle">


<span class="slider"></span>


</label>



</div>


</div>








<div class="setting-card">


<h3>

<i class="fa-solid fa-bell"></i>

<span data-key="notifications">
Notifications
</span>


</h3>





<div class="toggle-row">


<span data-key="rentReminders">
Rent reminders
</span>



<label class="switch">


<input 
type="checkbox"
id="rentNotify"
checked>


<span class="slider"></span>


</label>


</div>







<div class="toggle-row">


<span data-key="paymentAlerts">
Payment alerts
</span>



<label class="switch">


<input 
type="checkbox"
id="paymentNotify"
checked>


<span class="slider"></span>


</label>


</div>





</div>








<button id="saveSettings" class="save-btn" data-key="saveSettings">

Save Settings


</button>






</div>





<script src="../js/translations.js"></script>

<script src="../js/language.js"></script>

<script src="../js/settings.js"></script>



</body>


</html>
