<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification | Smart Rental Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">

</head>


<body>


<div class="form-container">


    <!-- Logo -->

    <div class="logo">

        <i class="fa-solid fa-shield-halved"></i>

    </div>



    <!-- Heading -->

    <h2 data-key="otpVerification">

        OTP Verification

    </h2>



    <p class="subtitle" data-key="otpSubtitle">

        Enter the verification code sent to your email.

    </p>




    <!-- OTP Form -->

    <form id="otpForm">


        <!-- OTP -->

        <div class="input-group">


            <label data-key="enterOtp">

                Enter OTP

            </label>



            <div class="input-box">


                <i class="fa-solid fa-lock"></i>



                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6 digit OTP"
                    maxlength="6"
                    required>


            </div>


        </div>





        <!-- Verify Button -->


        <button
            type="submit"
            class="submit-btn"
            onclick="window.location.href='reset-password.html'; return false;"
            data-key="verifyOtp">

            Verify OTP

        </button>



    </form>





    <!-- Bottom Links -->


    <div class="bottom-links">


        <p>

            <span data-key="notReceiveOtp">
                Didn't receive OTP?
            </span>


            <a href="#" data-key="resend">

                Resend

            </a>


        </p>



        <p style="margin-top:12px;">


            <a href="login.html" data-key="backLogin">

                Back to Login

            </a>


        </p>


    </div>




</div>


<!-- Language Scripts -->

<script src="../js/translations.js"></script>
<script src="../js/language.js"></script>

<script src="../js/otp-verification.js"></script>


</body>

</html>
