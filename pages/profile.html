<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Profile | Smart Rental Manager</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/profile.css">


</head>


<body>



<div class="profile-container">



<!-- Header -->


<header class="page-header">


<a href="dashboard.html">

<i class="fa-solid fa-arrow-left"></i>

</a>


<h2 data-key="myProfile">

My Profile

</h2>


</header>









<!-- Profile Card -->


<div class="profile-card">


<div class="profile-image">


<i class="fa-solid fa-user"></i>


</div>



<h2 id="userName">

Ali Ahmed

</h2>



<p id="userRole" data-key="tenant">

Tenant

</p>



</div>









<!-- Personal Information -->


<div class="info-card">


<h3>

<i class="fa-solid fa-user-pen"></i>

<span data-key="personalInformation">

Personal Information

</span>

</h3>






<div class="info-row">


<span data-key="fullName">

Full Name

</span>


<b>

Ali Ahmed

</b>


</div>






<div class="info-row">


<span data-key="email">

Email

</span>


<b>

ali@gmail.com

</b>


</div>






<div class="info-row">


<span data-key="phone">

Phone

</span>


<b>

0300-0000000

</b>


</div>




</div>









<!-- Account Actions -->


<div class="action-card">


<button id="editProfile">


<i class="fa-solid fa-pen"></i>


<span data-key="editProfile">

Edit Profile

</span>


</button>





<button id="logoutBtn" class="logout">


<i class="fa-solid fa-right-from-bracket"></i>


<span data-key="logout">

Logout

</span>


</button>



</div>







</div>






<script src="../js/translations.js"></script>
<script src="../js/language.js"></script>

<script src="../js/profile.js"></script>


</body>

</html>
